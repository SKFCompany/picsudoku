name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Check buildozer.spec for duplicate keys
        run: |
          dups=$(grep -E '^[A-Za-z_.0-9]+[[:space:]]*=' buildozer.spec | sed 's/[[:space:]]*=.*//' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Дубли ключей в buildozer.spec:"; echo "$dups"
            exit 1
          fi
          grep -qE '^requirements[[:space:]]*=[[:space:]]*\S' buildozer.spec || { echo "requirements пустой или отсутствует"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # JDK 17 через setup-java: на раннере по умолчанию в PATH старая JDK,
      # а Gradle для android.api=34 требует минимум 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev \
            libltdl-dev
          pip install --upgrade pip
          pip install cython==0.29.37
          pip install buildozer==1.5.0

      # buildozer 1.5.0 / p4a ищут sdkmanager по старому пути
      # $ANDROID_HOME/tools/bin/sdkmanager, а на раннере есть только
      # cmdline-tools. Симлинкуем (chmod не нужен — файл уже исполняемый).
      - name: Fix legacy sdkmanager path for python-for-android
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          REAL_SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -n1)
          if [ -z "$REAL_SDKMANAGER" ]; then
            echo "::error::sdkmanager not found anywhere under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 3 -iname "*sdkmanager*" || true
            exit 1
          fi
          echo "Found real sdkmanager at: $REAL_SDKMANAGER"
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$REAL_SDKMANAGER" "$SDK_ROOT/tools/bin/sdkmanager"
          "$SDK_ROOT/tools/bin/sdkmanager" --version
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee build.log
        timeout-minutes: 90

      - name: Key errors and last 100 lines (on failure)
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log | grep -v '^#     ' > build.clean.log || true
          echo "=== Ключевые ошибки ==="
          grep -nE "fatal error|ErrorReturnCode|Command failed|No module named|No matching|Could not|ERROR" build.clean.log | head -30 || true
          echo "=== Последние 100 строк (без дампа окружения) ==="
          tail -n 100 build.clean.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: picsudoku-apk
          path: bin/*.apk

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
