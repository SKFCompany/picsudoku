name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # env: сюда перенеси PIP_CONSTRAINT и прочее из workflow FlowDo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check buildozer.spec for duplicate keys
        run: |
          dups=$(grep -E '^[A-Za-z_.0-9]+[[:space:]]*=' buildozer.spec | sed 's/[[:space:]]*=.*//' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Дубли ключей в buildozer.spec (оставь по одной строке):"
            echo "$dups"
            grep -nE "^($(echo $dups | tr ' ' '|'))[[:space:]]*=" buildozer.spec
            exit 1
          fi

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer
        run: pip install --upgrade pip cython==0.29.36 buildozer

      - name: Build APK
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "buildozer exit code: $code" | tee -a build.log
          exit $code

      - name: Last 100 lines of log (on failure)
        if: failure()
        run: tail -n 100 build.log || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
